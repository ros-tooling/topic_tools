# Run linters automatically on pull requests.
name: Lint
on:
  pull_request:

env:
  AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: 1
jobs:
  ament_lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-rolling-ros-base:master
    strategy:
      fail-fast: false
      matrix:
          linter:
            - copyright
            - xmllint
            - lint_cmake
            - cppcheck
            - cpplint
            - uncrustify
            - pep257
            - flake8
    steps:
    - uses: actions/checkout@v6
    - uses: ros-tooling/action-ros-lint@0.1.4
      with:
        linter: ${{ matrix.linter }}
        distribution: rolling
        package-name: topic_tools topic_tools_interfaces
